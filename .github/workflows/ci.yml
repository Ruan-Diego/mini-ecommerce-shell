name: CI

# ADR-0004: CI só roda em PR para main (fim de cada fase) ou manualmente.
# Não adicione gatilho de push nem de PR para dev/feat: a cota de Actions é limitada.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Ler os pacotes @ruan-diego do GitHub Packages.
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Cria um .npmrc de usuário que lê NODE_AUTH_TOKEN (o pnpm não expande token no .npmrc do projeto).
          registry-url: https://npm.pkg.github.com
          scope: "@ruan-diego"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
